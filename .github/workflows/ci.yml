name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" (setting it here too is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db-check:
    name: drizzle-kit check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" (setting it here too is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No live database is required: drizzle-kit check only validates that the migration
      # journal is internally consistent. DATABASE_URL just needs to be a well-formed
      # connection string, since packages/db/drizzle.config.ts fails fast if it's unset
      # (see docs/roadmap/engineering-roadmap.md item 7).
      - run: pnpm db:check
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy

  scraper:
    name: Lint, test (scraper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scraper/requirements.txt

      - run: pip install -r requirements.txt

      - run: ruff check .
      - run: pytest

  pipeline:
    name: Lint, test, schema-conformance (pipeline)
    runs-on: ubuntu-latest
    # A real, migrated Postgres is what makes the schema-conformance test in
    # apps/pipeline/test_conformance.py meaningful (docs/roadmap/engineering-roadmap.md item 11,
    # the R1 mitigation in docs/architecture/prepora-next-level-plan.md §20) — this is a fresh,
    # credential-free service container scoped to this one job, not a live database secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prepora
          # No password at all: the container only lives for this job and is reachable only from
          # it, and a literal password here gets flagged by secret scanners (GitGuardian).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: prepora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prepora@localhost:5432/prepora_test
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" (setting it here too is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/pipeline/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: apps/pipeline

      - run: ruff check .
        working-directory: apps/pipeline
      - run: pytest
        working-directory: apps/pipeline

  # UI acceptance (CLAUDE.md → Working agreements → Testing): every spec's acceptance steps, plus a
  # core regression suite, run in a real browser against the real web app and pipeline service.
  # playwright.config.ts starts both against this job's throwaway Postgres (never .env), and
  # refuses any database that isn't local.
  e2e:
    name: E2E acceptance (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prepora
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: prepora_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://prepora@localhost:5432/prepora_e2e
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" (setting it here too is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/pipeline/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: apps/pipeline

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Proves the contributor setup in CONTRIBUTING.md still works from a clean checkout: the same
  # `pnpm bootstrap` a newcomer runs (project-local Postgres, so no service container or sudo), then
  # the health check, then the website actually serving the seeded demo data.
  bootstrap:
    name: Fresh setup (pnpm bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" (setting it here too is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: pnpm bootstrap (project-local database)
        run: pnpm bootstrap --project-db --yes

      - name: pnpm bootstrap:check
        run: pnpm bootstrap:check

      - name: The website serves the demo data
        run: |
          pnpm dev:web > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/ >/dev/null || { cat web.log; exit 1; }
          # The exam directory's API returns the two seeded demo exams.
          curl -sf -X POST http://localhost:3000/api/orpc/exams/list \
            -H 'Content-Type: application/json' -d '{}' | tee exams.json | grep -q demo-cloud-basics \
            || { echo "--- response:"; cat exams.json; echo; cat web.log; exit 1; }

  # Builds the Cloudflare Pages bundle exactly as a deploy does (minus the database-backed sitemap
  # and RSS steps), so a bundling or Workers-compatibility problem fails the PR instead of the
  # production deploy. The built site is kept as an artifact for local testing with
  # `wrangler pages dev`.
  web-build:
    name: Production build (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" (setting it here too is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web app for Cloudflare Pages
        run: pnpm --filter @prepora/web build 2>&1 | tee build.log
        env:
          NODE_ENV: production

      - name: Node.js compatibility is enabled in the bundle
        run: |
          if grep -q "Node.js compatibility is not enabled" build.log; then
            echo "::error::Nitro built without Node.js compatibility — server functions would fail on Cloudflare (see apps/web/app.config.ts)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: apps/web/dist
          retention-days: 7
