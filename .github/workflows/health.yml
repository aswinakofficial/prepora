name: Production health

# Hourly read-only check of the live site (docs/specs/16-engineering-team.md, decision 7): the
# smoke tests in tests/smoke. On failure it opens (or comments on) one `incident` issue; when the
# site recovers, it comments and closes it.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to check (to test the alerting, point it somewhere broken)"
        default: "https://prepora.xpar.in"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test
        id: smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://prepora.xpar.in' }}
        run: pnpm exec playwright test -c playwright.smoke.config.ts
      - name: Open, update or close the incident
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          BASE_URL: ${{ inputs.base_url || 'https://prepora.xpar.in' }}
        with:
          script: |
            const title = "Production health check failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "incident", per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (process.env.OUTCOME === "failure") {
              const body = `The hourly smoke test of ${process.env.BASE_URL} failed: ${run}`;
              if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ ...context.repo, title, labels: ["incident"], body });
              core.setFailed("Production health check failed");
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Recovered: ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed" });
            }
