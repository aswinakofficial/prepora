# Keeps the repository's labels in sync with .github/labels.json, so labels are reviewed like code.
# Creates and updates labels; never deletes ones that aren't listed.
name: Sync labels

on:
  push:
    branches: [main]
    paths: [".github/labels.json"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const wanted = JSON.parse(fs.readFileSync(".github/labels.json", "utf8"));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo, per_page: 100,
            });
            const byName = new Map(existing.map((l) => [l.name.toLowerCase(), l]));
            for (const label of wanted) {
              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
                core.info(`created ${label.name}`);
              } else if (current.color !== label.color || (current.description ?? "") !== label.description) {
                await github.rest.issues.updateLabel({
                  ...context.repo, name: current.name, new_name: label.name,
                  color: label.color, description: label.description,
                });
                core.info(`updated ${label.name}`);
              }
            }
