name: PR acceptance

# Enforces the testing working agreement (CLAUDE.md → Working agreements → Testing): every PR
# records its acceptance results, linked to the CI run with the evidence (screenshots and video per
# acceptance step). Reads only the PR's own body.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  acceptance:
    name: Acceptance results recorded
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR body and labels
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          body = os.environ.get("BODY") or ""
          labels = set(json.loads(os.environ.get("LABELS") or "[]"))
          problems = []

          match = re.search(r"^## Acceptance results\s*$(.*?)(?=^## |\Z)", body, re.M | re.S)
          if not match:
              problems.append('Add an "## Acceptance results" section (see the PR template).')
          else:
              section = re.sub(r"<!--.*?-->", "", match.group(1), flags=re.S)
              if re.search(r"^\s*- \[ \]", section, re.M):
                  problems.append("Acceptance results has an unticked box.")
              rows = [
                  line for line in section.splitlines()
                  if line.strip().startswith("|") and not re.match(r"^\|[\s#|:-]*\|?$", line.strip())
                  and not line.strip().startswith("| # |")
              ]
              filled = [r for r in rows if len([c for c in r.split("|")[1:-1] if c.strip()]) >= 4]
              na = re.search(r"^\s*N/A:\s*\S", section, re.M | re.I)
              if not filled and not na:
                  problems.append(
                      'Acceptance results needs filled-in rows (step, expected, result, checked by), '
                      'or a line "N/A: <why>" for a change with nothing to see in the UI.'
                  )

          # UI sign-off is by evidence, not a label (owner, 2026-10-13; docs/specs/16-engineering-team.md):
          # a PR with acceptance rows links the CI run whose "Acceptance evidence" shows each step.
          if match and not na and filled and not re.search(
              r"Evidence:\s*https://github\.com/[^/\s]+/[^/\s]+/actions/runs/\d+", section
          ):
              problems.append(
                  "Acceptance results need an evidence link: a line "
                  '"Evidence: https://github.com/<owner>/<repo>/actions/runs/<id>" pointing at the '
                  "CI run whose summary shows each step's screenshot and video."
              )

          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY
