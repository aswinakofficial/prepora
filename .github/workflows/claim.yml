# Lets anyone claim an issue by commenting "/claim" (or release it with "/unclaim"), since only
# people with write access can assign themselves directly. See CONTRIBUTING.md → "Claiming an issue".
# Also moves the issue's card on the project board (In progress / back to Ready).
name: Claim issues

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  claim:
    # Issues only (not pull requests), and only the two commands.
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const MAX_OPEN_CLAIMS = 2;
            const { syncIssueSafely } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project-status.cjs`);
            const syncBoard = () =>
              syncIssueSafely({ core, ...context.repo, number: context.payload.issue.number });
            const issue = context.payload.issue;
            const user = context.payload.comment.user.login;
            const command = context.payload.comment.body.trim().split(/\s+/)[0];
            const reply = (body) =>
              github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            const labels = issue.labels.map((l) => l.name);
            const assignees = issue.assignees.map((a) => a.login);

            if (command === "/unclaim") {
              if (!assignees.includes(user)) return;
              await github.rest.issues.removeAssignees({ ...context.repo, issue_number: issue.number, assignees: [user] });
              await reply(`@${user} has released this issue — it's open for someone else to claim.`);
              await syncBoard();
              return;
            }
            if (command !== "/claim") return;

            if (issue.state !== "open") return reply(`@${user} this issue is closed, so it can't be claimed.`);
            if (labels.includes("status: maintainer") || labels.includes("status: needs design")) {
              return reply(`@${user} thanks! This one is ${labels.includes("status: maintainer") ? "kept by the maintainers" : "still being designed"}, so it can't be claimed yet. Have a look at the [good first issues](https://github.com/${context.repo.owner}/${context.repo.repo}/labels/good%20first%20issue) or [help wanted](https://github.com/${context.repo.owner}/${context.repo.repo}/labels/help%20wanted).`);
            }
            if (assignees.includes(user)) return reply(`@${user} this issue is already yours.`);
            if (assignees.length > 0) {
              return reply(`@${user} thanks! This issue is already claimed by @${assignees.join(", @")}. If there's no activity for 3 weeks it's released automatically.`);
            }
            const mine = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", assignee: user, per_page: 100,
            });
            const openClaims = mine.filter((i) => !i.pull_request).length;
            if (openClaims >= MAX_OPEN_CLAIMS) {
              return reply(`@${user} you already have ${openClaims} open issues claimed — please finish or \`/unclaim\` one first, so others get a chance too.`);
            }
            await github.rest.issues.addAssignees({ ...context.repo, issue_number: issue.number, assignees: [user] });
            await syncBoard();
            await reply(
              `@${user} it's yours — thanks! 🙌\n\n` +
              `- Open a pull request that says \`Closes #${issue.number}\` (a **draft PR early** is welcome).\n` +
              `- Questions? Ask right here.\n` +
              `- If there's no activity for 3 weeks, the issue is released for someone else; comment \`/unclaim\` to release it yourself.`
            );
